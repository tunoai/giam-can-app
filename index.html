<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FitLife">
    <title>FitLife</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css?v=7">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>
</head>
<body>
    <div class="app" id="app">
        <header class="topbar">
            <div class="topbar-title">
                <span class="topbar-hello" id="topbar-hello">Xin chào 👋</span>
                <strong id="topbar-title">Hôm nay</strong>
            </div>
            <div class="topbar-actions">
                <span class="sync-dot" id="sync-dot" title="Trạng thái đồng bộ"></span>
                <button class="avatar-btn" id="btn-profile" aria-label="Cài đặt">
                    <img src="tung_chu_avatar.png" alt="" id="avatar-img" onerror="this.src='icon-192.png'">
                </button>
            </div>
        </header>

        <main class="content" id="content">
            <section class="view active" id="view-today"></section>
            <section class="view" id="view-food"></section>
            <section class="view" id="view-run"></section>
            <section class="view" id="view-gym"></section>
            <section class="view" id="view-weight"></section>
        </main>

        <nav class="tabbar" id="tabbar">
            <button class="tab active" data-view="today"><i data-lucide="house"></i><span>Hôm nay</span></button>
            <button class="tab" data-view="food"><i data-lucide="utensils"></i><span>Ăn uống</span></button>
            <button class="tab" data-view="run"><i data-lucide="footprints"></i><span>Chạy 5K</span></button>
            <button class="tab" data-view="gym"><i data-lucide="dumbbell"></i><span>Gym</span></button>
            <button class="tab" data-view="weight"><i data-lucide="scale"></i><span>Cân nặng</span></button>
        </nav>

        <!-- Bottom sheet dùng chung -->
        <div class="sheet-backdrop" id="sheet-backdrop"></div>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true">
            <div class="sheet-handle"></div>
            <div class="sheet-body" id="sheet-body"></div>
        </div>

        <!-- Màn hình hẹn giờ toàn màn (chạy / khởi động) -->
        <div class="player" id="player"></div>

        <div class="toast" id="toast"></div>
    </div>

    <input type="file" accept="image/*" id="file-input" hidden>

    <script src="data.js?v=6"></script>
    <script src="food-db.js?v=6"></script>
    <script src="app.js?v=7"></script>
</body>
</html>
